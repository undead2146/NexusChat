name: Build Android APK

on:
  push:
    branches: [ main, Development ]
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
      - '**.excalidraw'
  pull_request:
    branches: [ main, Development ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build .NET MAUI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore NuGet packages
        run: dotnet restore NexusChat.csproj

      - name: Publish Android APK
        run: dotnet publish NexusChat.csproj -f net9.0-android -c Release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexuschat-android-apk
          path: |
            **/bin/Release/net9.0-android/**/*.apk
            **/bin/Release/net9.0-android/**/*.aab
          if-no-files-found: error
